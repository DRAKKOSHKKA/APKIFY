name: Build iOS IPA (Free CI)

on:
    workflow_dispatch:
        inputs:
            create_release:
                description: "Опубликовать в GitHub Releases?"
                required: false
                type: boolean
                default: false
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build-ios:
        name: Build Unsigned IPA on macOS
        runs-on: macos-14

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js 22 LTS
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🔍 TypeScript verification
              run: npx tsc --noEmit

            - name: 🛠️ Expo Prebuild (Generate native iOS project)
              run: npx expo prebuild --platform ios --clean

            - name: ☕ Install CocoaPods & Disable Native Code Signing
              run: |
                  cd ios
                  pod install
                  cd ..
                  # Отключаем обязательную подпись Xcode для сборки без аккаунта разработчика
                  sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true
                  sed -i '' 's/ProvisioningStyle = "Automatic";/ProvisioningStyle = "Manual";/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true
                  find ios/Pods -name "*.xcconfig" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' {} + 2>/dev/null || true

            - name: 🍏 Compile iOS App (Unsigned)
              run: |
                  WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
                  SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | head -n 1)
                  echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
                  xcodebuild -workspace "$WORKSPACE" \
                    -scheme "$SCHEME" \
                    -configuration Release \
                    -destination 'generic/platform=iOS' \
                    -derivedDataPath build/DerivedData \
                    CODE_SIGN_STYLE=Manual \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    build

            - name: 📦 Package .ipa file
              run: |
                  mkdir -p build/Payload
                  APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
                  echo "Found application bundle: $APP_PATH"
                  cp -r "$APP_PATH" build/Payload/
                  cd build
                  zip -r -q Apkify.ipa Payload
                  cd ..
                  ls -lh build/Apkify.ipa

            - name: 🚀 Upload IPA Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Apkify-iOS-IPA
                  path: build/Apkify.ipa
                  retention-days: 30

            - name: 🏷️ Publish to GitHub Releases (Optional / on tag)
              if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.create_release == true }}
              uses: softprops/action-gh-release@v2
              with:
                  files: build/Apkify.ipa
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
