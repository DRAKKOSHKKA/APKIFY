name: Build iOS IPA (Free CI)

on:
    workflow_dispatch:
        inputs:
            create_release:
                description: "Опубликовать в GitHub Releases?"
                required: false
                type: boolean
                default: false
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build-ios:
        name: Build Unsigned IPA on macOS
        runs-on: macos-15

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🍏 Select Xcode 16
              run: |
                  if [ -d "/Applications/Xcode_16.2.app" ]; then
                    sudo xcode-select -s /Applications/Xcode_16.2.app
                  elif [ -d "/Applications/Xcode_16.1.app" ]; then
                    sudo xcode-select -s /Applications/Xcode_16.1.app
                  fi
                  xcodebuild -version

            - name: 🟢 Setup Node.js 22 LTS
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🔍 TypeScript verification
              run: npx tsc --noEmit

            - name: 🛠️ Expo Prebuild (Generate native iOS project)
              run: npx expo prebuild --platform ios --clean --no-install

            - name: ☕ Configure Podfile & Install CocoaPods
              run: |
                  # Внедряем отключение подписи в post_install Podfile
                  ruby -e '
                    path = "ios/Podfile"
                    content = File.read(path)
                    code = %Q{
                      installer.pods_project.targets.each do |target|
                        target.build_configurations.each do |config|
                          config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                          config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                          config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                        end
                      end
                    }
                    if content.include?("post_install do |installer|")
                      content.sub!("post_install do |installer|", "post_install do |installer|\n" + code)
                      File.write(path, content)
                    end
                  '
                  cd ios
                  pod install
                  cd ..
                  # Отключаем обязательную автоматическую подпись Xcode для сборки без Apple ID
                  sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true
                  sed -i '' 's/ProvisioningStyle = "Automatic";/ProvisioningStyle = "Manual";/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true
                  sed -i '' 's/DevelopmentTeam = [^;]*;/DevelopmentTeam = "";/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true
                  sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true
                  find ios/Pods -name "*.xcconfig" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' {} + 2>/dev/null || true

            - name: 🍏 Compile iOS App (Unsigned)
              run: |
                  WORKSPACE="ios/Apkify.xcworkspace"
                  if [ ! -d "$WORKSPACE" ]; then
                    WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
                  fi
                  SCHEME="Apkify"
                  echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
                  xcodebuild -workspace "$WORKSPACE" \
                    -scheme "$SCHEME" \
                    -configuration Release \
                    -destination 'generic/platform=iOS' \
                    -derivedDataPath build/DerivedData \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGN_ENTITLEMENTS="" \
                    CODE_SIGN_STYLE=Manual \
                    DEVELOPMENT_TEAM="" \
                    COMPILER_INDEX_STORE_ENABLE=NO \
                    build

            - name: 📦 Package .ipa file
              run: |
                  mkdir -p build/Payload
                  APP_PATH=$(find build/DerivedData -name "*.app" | head -n 1)
                  echo "Found application bundle: $APP_PATH"
                  cp -r "$APP_PATH" build/Payload/
                  cd build
                  zip -r -q Apkify.ipa Payload
                  cd ..
                  ls -lh build/Apkify.ipa

            - name: 🚀 Upload IPA Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Apkify-iOS-IPA
                  path: build/Apkify.ipa
                  retention-days: 30

            - name: 🏷️ Publish to GitHub Releases (Optional / on tag)
              if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.create_release == true }}
              uses: softprops/action-gh-release@v2
              with:
                  files: build/Apkify.ipa
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
