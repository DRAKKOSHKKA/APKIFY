name: Build iOS IPA (Free CI)

on:
    workflow_dispatch:
        inputs:
            create_release:
                description: "Опубликовать в GitHub Releases?"
                required: false
                type: boolean
                default: true
            tag_name:
                description: "Тег релиза (например, v1.8R)"
                required: false
                type: string
                default: "v1.8R"

permissions:
    contents: write

jobs:
    build-ios:
        name: Build Unsigned IPA on macOS
        runs-on: macos-15
        env:
            EXPO_USE_PRECOMPILED_MODULES: "0"

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🍏 Select Xcode and verify iOS SDK
              shell: bash
              run: |
                  set -euo pipefail

                  echo "Available Xcode installations:"
                  ls -d /Applications/Xcode*.app || true

                  CANDIDATES=(
                    "/Applications/Xcode_16.4.app"
                    "/Applications/Xcode.app"
                    "/Applications/Xcode_16.3.app"
                    "/Applications/Xcode_16.2.app"
                    "/Applications/Xcode_16.1.app"
                    "/Applications/Xcode_16.0.app"
                  )

                  XCODE_PATH=""
                  for candidate in "${CANDIDATES[@]}"; do
                    if [ -d "$candidate/Contents/Developer" ]; then
                      echo "Checking candidate: $candidate"
                      if "$candidate/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null | grep -q "iOS SDKs"; then
                        XCODE_PATH="$candidate"
                        break
                      else
                        echo "Candidate $candidate does not have iOS SDK installed, skipping."
                      fi
                    fi
                  done

                  if [ -z "$XCODE_PATH" ]; then
                    echo "No compatible Xcode installation with iOS SDK found"
                    exit 1
                  fi

                  echo "Selected Xcode: $XCODE_PATH"
                  sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
                  echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

                  xcodebuild -version
                  xcodebuild -showsdks

                  if ! xcodebuild -showsdks | grep -q "iOS SDKs"; then
                    echo "Selected Xcode does not contain an iOS SDK"
                    exit 1
                  fi

            - name: 🟢 Setup Node.js 22 LTS
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: 📦 Install dependencies
              run: npm ci

            - name: 💎 Validate Expo autolinking Ruby scripts
              shell: bash
              run: |
                  set -euo pipefail
                  AUTOLINKING_SCRIPT="node_modules/expo-modules-autolinking/scripts/ios/precompiled_modules.rb"
                  test -f "$AUTOLINKING_SCRIPT"
                  ruby -c "$AUTOLINKING_SCRIPT"

            - name: 🔍 TypeScript verification
              run: npx tsc --noEmit

            - name: 🛠️ Expo Prebuild (Generate native iOS project)
              run: npx expo prebuild --platform ios --clean --no-install

            - name: 🩹 Patch ExpoModulesJSI for Swift 6.1 compatibility
              run: node scripts/patch-expo-modules-jsi.js

            - name: ✅ Verify ExpoModulesJSI patch
              shell: bash
              run: |
                  set -euo pipefail
                  FILE="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptPromise.swift"
                  test -f "$FILE"
                  COUNT=$(grep -c 'self.longLivedState = LongLivedState()' "$FILE" || true)
                  echo "Found $COUNT occurrences of 'self.longLivedState = LongLivedState()' in $FILE"
                  sed -n '60,105p' "$FILE"
                  if [ "$COUNT" -ne 2 ]; then
                    echo "::error::JavaScriptPromise.swift was not patched in both initializers (found $COUNT, expected 2)"
                    exit 1
                  fi
                  # Проверяем синтаксис Ruby после выполнения скрипта патчей
                  ruby -c node_modules/expo-modules-autolinking/scripts/ios/precompiled_modules.rb

            - name: ☕ Configure Podfile & Install CocoaPods
              shell: bash
              run: |
                  set -euo pipefail
                  export EXPO_USE_PRECOMPILED_MODULES=0

                  echo "EXPO_USE_PRECOMPILED_MODULES=${EXPO_USE_PRECOMPILED_MODULES:-unset}"

                  # Внедряем отключение обязательной подписи и настраиваем мягкую конкурентность Swift
                  ruby -e '
                    path = "ios/Podfile"
                    content = File.read(path)
                    code = %Q{
                      installer.pods_project.targets.each do |target|
                        target.build_configurations.each do |config|
                          config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                          config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                          config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                          config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
                          config.build_settings["SWIFT_TREAT_WARNINGS_AS_ERRORS"] = "NO"
                          config.build_settings["GCC_WARN_INHIBIT_ALL_WARNINGS"] = "YES"
                        end
                      end
                    }
                    if content.include?("post_install do |installer|")
                      content.sub!("post_install do |installer|", "post_install do |installer|\n" + code)
                      File.write(path, content)
                    end
                  '
                  cd ios
                  pod deintegrate || true
                  rm -rf Pods Podfile.lock
                  pod install --repo-update
                  cd ..

                  # Отключаем обязательную автоматическую подпись Xcode для сборки без Apple ID
                  sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true
                  sed -i '' 's/ProvisioningStyle = "Automatic";/ProvisioningStyle = "Manual";/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true
                  sed -i '' 's/DevelopmentTeam = [^;]*;/DevelopmentTeam = "";/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true
                  sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' ios/*.xcodeproj/project.pbxproj 2>/dev/null || true

            - name: 🍏 Compile iOS App (Unsigned)
              shell: bash
              run: |
                  set -euo pipefail

                  rm -rf build/DerivedData

                  WORKSPACE="ios/Apkify.xcworkspace"
                  if [ ! -d "$WORKSPACE" ]; then
                    WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
                  fi

                  if [ -z "$WORKSPACE" ]; then
                    echo "No Xcode workspace found"
                    exit 1
                  fi

                  SCHEME="Apkify"
                  echo "Listing workspace schemes:"
                  xcodebuild -workspace "$WORKSPACE" -list || true

                  echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
                  xcodebuild -workspace "$WORKSPACE" \
                    -scheme "$SCHEME" \
                    -configuration Release \
                    -sdk iphoneos \
                    -destination 'generic/platform=iOS' \
                    -derivedDataPath build/DerivedData \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGN_ENTITLEMENTS="" \
                    CODE_SIGN_STYLE=Manual \
                    DEVELOPMENT_TEAM="" \
                    COMPILER_INDEX_STORE_ENABLE=NO \
                    build

            - name: 📦 Package .ipa file
              shell: bash
              run: |
                  set -euo pipefail

                  mkdir -p build/Payload
                  APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Apkify.app"
                  if [ ! -d "$APP_PATH" ]; then
                    APP_PATH=$(find build/DerivedData/Build/Products -type d -name "*.app" -print -quit)
                  fi

                  if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
                    echo "::error::No .app bundle was produced"
                    find build/DerivedData/Build/Products -maxdepth 3 -print || true
                    exit 1
                  fi

                  echo "Found application bundle: $APP_PATH"
                  cp -R "$APP_PATH" build/Payload/

                  # Устанавливаем права на исполнение для бинарников и фреймворков
                  chmod -R 755 build/Payload/

                  # Полностью удаляем все подписи — Sideloadly сам подпишет каждый фреймворк
                  # и приложение своим сертификатом от вашего Apple ID.
                  # Наличие ad-hoc (--sign -) подписей приводит к тому, что Sideloadly пропускает
                  # переподписание фреймворков, и iOS убивает приложение при запуске (SIGKILL CODESIGNING).
                  find build/Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
                  find build/Payload -name "*.mobileprovision" -delete 2>/dev/null || true

                  cd build
                  zip -r -y -q Apkify.ipa Payload
                  cd ..
                  ls -lh build/Apkify.ipa

            - name: 🚀 Upload IPA Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Apkify-iOS-IPA
                  path: build/Apkify.ipa
                  retention-days: 30

            - name: 🏷️ Publish to GitHub Releases (Optional / on tag)
              if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.create_release == true }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.8R' }}
                  name: ${{ format('Apkify {0}', inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.8R') }}
                  files: build/Apkify.ipa
                  generate_release_notes: true
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
